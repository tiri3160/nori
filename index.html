:root{
  --gold:#ffd25e; --gold2:#ffb238; --ink:#1b1440; --night:#0d0b2a; --glass:rgba(16,12,48,.62);
  --font:'Baloo Bhaijaan 2', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:#fff;font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0}
img,video,canvas{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
.bg,.nori img,#pop3d img,.vignette{pointer-events:none}
body{-webkit-touch-callout:none;touch-action:manipulation}
.hidden{display:none!important}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#setup{background:radial-gradient(ellipse at 50% 30%,#2b2470 0%,#0d0b2a 70%);overflow:auto;padding:20px}
.card{width:min(460px,100%);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:22px 22px 26px;backdrop-filter:blur(8px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card h1{margin:4px 0 2px;font-size:30px;line-height:1.15;color:var(--gold)}
.card p.sub{margin:0 0 14px;opacity:.85;font-size:15px}
.card .nori-hero{width:150px;height:150px;margin:-4px auto 2px;display:block;filter:drop-shadow(0 0 18px rgba(255,210,94,.6));animation:float 4s ease-in-out infinite}
.field{margin:12px 0;text-align:start}
.field label{display:block;font-size:14px;opacity:.85;margin:0 4px 6px}
.field input{width:100%;font:inherit;font-size:20px;padding:12px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:#fff;outline:none;text-align:center}
.field input:focus{border-color:var(--gold)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;padding:11px 8px;border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-size:17px;border:2px solid transparent}
.seg button.on{background:rgba(255,210,94,.18);border-color:var(--gold);color:var(--gold)}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:14px 34px;border-radius:999px;font-size:22px;font-weight:800;color:var(--ink);background:linear-gradient(180deg,#ffe58a,#ffb238);box-shadow:0 8px 24px rgba(255,178,56,.45),inset 0 -3px 0 rgba(0,0,0,.12)}
.big:active{transform:scale(.96)}
.small-note{font-size:12px;opacity:.6;margin-top:12px}
.brand{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 12px;border-radius:999px;border:1px solid rgba(255,210,94,.45);background:rgba(255,210,94,.08);direction:ltr}
.brand-mark{color:var(--gold);font-size:14px;text-shadow:0 0 8px var(--gold)}
.brand-name{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;letter-spacing:.22em;font-size:13px;color:#fff}
.brand-pres{font-size:12px;opacity:.7;letter-spacing:.02em}
.brand-foot{position:absolute;bottom:2px;inset-inline-start:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.25em;font-weight:800;opacity:.55;direction:ltr;white-space:nowrap;pointer-events:none}
[dir=rtl] .brand-foot{transform:translateX(50%)}
.brand-corner{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 58px));inset-inline-end:14px;z-index:9;font-size:10px;letter-spacing:.28em;font-weight:800;opacity:.45;direction:ltr;pointer-events:none;text-shadow:0 1px 4px #000}

/* ---------- book ---------- */
#book{background:#000}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;transition:opacity .9s ease,transform .3s ease-out;will-change:transform}
.bg.out{opacity:0}
#fx{position:absolute;inset:0;pointer-events:none}
#layer{position:absolute;inset:0}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(5,3,20,.55) 100%)}

/* Nori sprite: black background disappears with screen blending */
.nori{position:absolute;left:50%;top:44%;width:min(34vmin,260px);aspect-ratio:1;transform:translate(-50%,-50%);transition:filter .8s ease,left 1.2s cubic-bezier(.5,0,.3,1),top 1.2s cubic-bezier(.5,0,.3,1),width .8s ease;cursor:pointer;z-index:3}
.nori img{width:100%;height:100%;display:block;animation:float 4s ease-in-out infinite;pointer-events:none}
.nori.shake img{animation:shake .5s ease-in-out}
.nori.spin img{animation:spin3 1s ease-in-out}
.nori.jump img{animation:jump .7s ease-out}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4%) rotate(2deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes spin3{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-22%) scale(1.08,.95)}70%{transform:translateY(0) scale(.96,1.04)}100%{transform:translateY(0)}}

/* top bar */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 8px;z-index:10;pointer-events:none}
#top>*{pointer-events:auto}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--glass);color:#fff;font-size:21px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px)}
.ibtn.on{background:rgba(255,210,94,.25);border-color:var(--gold)}
.ibtn:active{transform:scale(.92)}
#meter{flex:1;max-width:280px;margin-inline:auto;height:22px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.15);position:relative;overflow:hidden;transition:opacity .5s}
#meterFill{position:absolute;inset-block:0;inset-inline-start:0;width:10%;background:linear-gradient(90deg,#ffb238,#ffe58a);box-shadow:0 0 18px #ffd25e;transition:width 1.2s ease}
#meter span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}

/* text panel */
#panel{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 24px));background:var(--glass);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:14px 18px 12px;backdrop-filter:blur(10px);z-index:10;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#txt{font-size:clamp(19px,2.6vw + 8px,28px);line-height:1.55;font-weight:700;min-height:2.6em;text-shadow:0 2px 8px rgba(0,0,0,.4)}
#txt .w{transition:color .2s}
#txt .w.hl{color:var(--gold)}
#txt2{font-size:clamp(14px,1.6vw + 6px,18px);line-height:1.45;opacity:.8;margin-top:6px;border-top:1px dashed rgba(255,255,255,.2);padding-top:6px}
#hint{margin-top:8px;font-size:14px;color:var(--gold);display:flex;align-items:center;gap:6px;justify-content:center}
#hint:empty{display:none}
#nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
#dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.navbtn{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#ffe58a,#ffb238);color:var(--ink);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(255,178,56,.4)}
.navbtn:disabled{opacity:.3;box-shadow:none}
.navbtn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,94,.7)}50%{box-shadow:0 0 0 12px rgba(255,210,94,0)}}

/* interactive bits */
.tapme{position:absolute;z-index:4;cursor:pointer}
.sparkle{position:absolute;width:10px;height:10px;pointer-events:none;z-index:6}
.sparkle::before{content:'';position:absolute;inset:-14px;background:radial-gradient(circle,#fff 0 8%,#ffe58a 14%,transparent 60%);border-radius:50%;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.2);opacity:0}}
.heart{position:absolute;font-size:28px;pointer-events:none;z-index:6;animation:rise 1.6s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-140px) scale(1.2);opacity:0}}
.bubble{position:absolute;z-index:7;background:#fff;color:var(--ink);font-weight:800;padding:6px 14px;border-radius:18px;font-size:18px;white-space:nowrap;transform:translate(-50%,-120%);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:pop .4s ease-out}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(.4)}100%{transform:translate(-50%,-120%) scale(1)}}

.shadowmon{position:absolute;width:24vmin;height:28vmin;z-index:4;cursor:pointer;transition:opacity .8s,transform .8s}
.shadowmon svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(0,0,0,.8))}
.shadowmon.revealed{transform:scale(.85)}
.shadowmon .mon{transition:opacity .6s}
.shadowmon .real{opacity:0;transition:opacity .6s .2s}
.shadowmon.revealed .mon{opacity:0}
.shadowmon.revealed .real{opacity:1}

.breath{position:absolute;left:50%;top:50%;width:min(44vmin,300px);aspect-ratio:1;transform:translate(-50%,-62%);border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;touch-action:none}
.breath .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,210,94,.7);background:radial-gradient(circle,rgba(255,210,94,.25),rgba(255,210,94,.02) 70%);transform:scale(.55);transition:transform 3s ease-in-out}
.breath.in .ring{transform:scale(1)}
.breath b{position:relative;font-size:22px;text-shadow:0 2px 6px #000}
.breath small{position:relative;opacity:.85}
.steps{position:absolute;left:50%;top:14%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.steps i{width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);display:block}
.steps i.on{background:var(--gold);box-shadow:0 0 12px var(--gold)}

.brave{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:5;padding:14px 26px;border-radius:22px;background:rgba(255,255,255,.92);color:var(--ink);font-size:clamp(22px,4vw,34px);font-weight:800;box-shadow:0 0 0 0 rgba(255,210,94,.8);animation:pulse 1.6s infinite}
.brave:active{transform:translateX(-50%) scale(.95)}

.catchstar{position:absolute;width:64px;height:64px;z-index:6;cursor:pointer;transition:left 1.4s ease-in-out,top 1.4s ease-in-out}
.catchstar svg{width:100%;height:100%;filter:drop-shadow(0 0 12px #ffd25e);animation:twinkle 1s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(15deg)}}

.streak{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 18px 8px #ffe58a;z-index:5;pointer-events:none}

/* 3D pop */
#pop3d{position:absolute;left:50%;top:44%;width:min(46vmin,340px);aspect-ratio:1;transform:translate(-50%,-50%);perspective:900px;z-index:5;cursor:grab;touch-action:none}
#pop3d .rig{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .08s linear}
#pop3d .lyr{position:absolute;inset:0;backface-visibility:visible}
#pop3d .lyr img{width:100%;height:100%}
#pop3d .glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,210,94,.55),rgba(255,210,94,0) 60%);transform:translateZ(-60px);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:translateZ(-60px) scale(.9)}50%{opacity:1;transform:translateZ(-60px) scale(1.1)}}
.rot-hint{position:absolute;left:50%;top:78%;transform:translateX(-50%);z-index:5;font-size:15px;background:var(--glass);padding:6px 14px;border-radius:999px}

/* room photo */
#roomPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.photoBtn{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:6;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.4)}

/* overlays (hologram, certificate, parents, settings) */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,3,20,.92);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.overlay .card{max-height:100%;overflow:auto}
.closeX{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline-end:12px;z-index:60}
#holo{background:#000;padding:0}
#holoCanvas{width:100vmin;height:100vmin;display:block}
.holo-ui{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:55}
#certImg{width:100%;border-radius:14px;display:block;margin:10px 0}
.qlist{text-align:start;line-height:1.7;font-size:17px}
.qlist li{margin:6px 0}
.tpl{background:#fff;border-radius:14px;padding:10px;margin:10px 0}
.tpl svg{width:100%;height:auto;display:block}
.lang-pick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}


/* ---------- print / PDF ---------- */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#0d0b2a!important}
  body>*:not(#print){display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pp{width:297mm;height:210mm;position:relative;overflow:hidden;background:#0d0b2a;color:#fff;page-break-after:always;break-after:page;font-family:var(--font)}
.pp:last-child{page-break-after:auto;break-after:auto}
.pp .pimg{position:absolute;left:0;top:0;width:100%;height:152mm;object-fit:cover}
.pp .pnori{position:absolute}
.pp .ptxt{position:absolute;left:0;right:0;bottom:0;height:58mm;padding:7mm 16mm 0;background:linear-gradient(180deg,#151046,#0d0b2a);font-size:17pt;line-height:1.5;font-weight:700}
.pp .ptxt::before{content:'';position:absolute;left:0;right:0;top:-14mm;height:14mm;background:linear-gradient(180deg,transparent,#151046)}

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tone(freq,dur=.35,type='sine',vol=.18,delay=0,slide=0){
  const a=ac(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*slide),t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}

  twinkle(){ tone(1800+Math.random()*900,.4,'triangle',.1); },
  whoosh(){ const a=ac(); if(!a) return; const n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*1.2,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(2500,a.currentTime); f.frequency.exponentialRampToValueAtTime(300,a.currentTime+1.1); const g=a.createGain(); g.gain.value=.35; n.connect(f).connect(g).connect(a.destination); n.start(); tone(1400,.9,'sine',.08,0,.3); },
  giggle(){ [880,1040,940,1180,1000].forEach((f,i)=>tone(f,.12,'triangle',.12,i*.09,1.15)); },

let voices=[];
function loadVoices(){ try{ voices = speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  const p = VOICE_LANG[lang];
  const list = voices.filter(v=> (v.lang||'').toLowerCase().startsWith(p));
  const pref = list.find(v=>/natural|neural|online|premium|enhanced/i.test(v.name)) || list.find(v=>/female|zira|hoda|salma|amelie|audrey|samantha/i.test(v.name));
  return pref || list[0] || null;
}
function speak(text, lang, onEnd){
  stopSpeak();
  if(!S.read || !('speechSynthesis' in window)){ onEnd&&onEnd(); return; }
  const v = pickVoice(lang);
  if(!v && voices.length){ onEnd&&onEnd(); return; }
  try{
    const u = new SpeechSynthesisUtterance(text.replace(/[«»"“”]/g,''));
    u.lang = v? v.lang : ({ar:'ar-SA',en:'en-US',fr:'fr-FR'})[lang];
    if(v) u.voice=v;
    u.rate = lang==='ar'? .85 : .9; u.pitch = 1.08;
    u.onboundary = e=>{ if(lang!==S.lang) return; hlWord(e.charIndex); };
    u.onend = ()=>{ clearHl(); onEnd&&onEnd(); };
    speechSynthesis.speak(u);
  }catch(e){ onEnd&&onEnd(); }
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} clearHl(); }

function hlWord(ci){ $$('#txt .w').forEach(w=>w.classList.remove('hl')); const w = wordMap.find(x=>ci>=x.s && ci<x.e); if(w) w.el.classList.add('hl'); }

function narrate(k, lang, onEnd, fallbackText){
  stopSpeak(); stopNarr();
  if(!S.read){ onEnd&&onEnd(); return; }
  const list=AUD[lang] && AUD[lang][S.g]; const name=list && list[k];
  if(!name){ speak(fallbackText||'', lang, onEnd); return; }

const fx = $('#fx'), fctx = fx.getContext('2d');
let parts=[], fxRun=false, W=0, H=0, DPR=1;
function sizeFx(){ DPR=Math.min(2,window.devicePixelRatio||1); W=fx.clientWidth; H=fx.clientHeight; fx.width=W*DPR; fx.height=H*DPR; fctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize', sizeFx);
function addParts(n, opts={}){
  for(let i=0;i<n;i++) parts.push({x:opts.x??Math.random()*W, y:opts.y??Math.random()*H*.7, vx:(Math.random()-.5)*(opts.sp||.3), vy:(opts.vy??-Math.random()*.2), r:Math.random()*2+.6, life:opts.life||9999, a:Math.random(), wind:opts.wind||0});
}
function fxLoop(){
  if(!fxRun) return;
  fctx.clearRect(0,0,W,H);
  for(const p of parts){
    p.x+=p.vx+p.wind; p.y+=p.vy; p.a+=.03; p.life--;
    if(p.x<-10) p.x=W+10; if(p.x>W+10) p.x=-10; if(p.y<-10) p.y=H*.8;
    const al = (.4+.6*Math.abs(Math.sin(p.a))) * Math.min(1,p.life/40);
    fctx.beginPath(); fctx.fillStyle=`rgba(255,236,170,${al})`; fctx.shadowColor='#ffd25e'; fctx.shadowBlur=8;
    fctx.arc(p.x,p.y,p.r,0,7); fctx.fill();
  }
  parts = parts.filter(p=>p.life>0);
  requestAnimationFrame(fxLoop);
}
function startFx(){ if(S.lite){ fxRun=false; fctx.clearRect(0,0,W,H); return; } if(!fxRun){ fxRun=true; requestAnimationFrame(fxLoop);} }

let pageDone=false, cleanup=[];
function done(){
  if(pageDone) return; pageDone=true; S.done[S.page]=true; $('#nextBtn').classList.add('pulse');
  const p=PAGES[S.page], pg=S.page;
  if(p.vid && VIDS_OK){
    const t0=Date.now();
    const tryPlay=()=>{ if(S.page!==pg) return; const n=$('#narr'); const talking=!n.paused && !n.ended;
      let tts=false; try{ tts=speechSynthesis.speaking; }catch(e){}
      if((talking||tts) && Date.now()-t0<25000){ later(tryPlay,300); return; }
      playVid(p.vid, ()=>{ if(S.page===pg) go(pg+1); }); };
    later(tryPlay, 1100);
  }
  else if(S.watch && S.page<PAGES.length-1){ later(()=>{ if(S.page===pg) go(pg+1); }, 1200); }
}

  const ov=$('#vidOv'), v=$('#vidEl'); stopSpeak(); stopNarr(); vidCb=cb;
  v.src='vid/'+name+'.mp4'; v.currentTime=0; v.muted=false;
  ov.classList.remove('hidden'); requestAnimationFrame(()=>ov.classList.add('show'));
  const fin=()=>{ v.onended=null; v.onerror=null; ov.classList.remove('show'); setTimeout(()=>{ ov.classList.add('hidden'); v.pause(); v.removeAttribute('src'); v.load(); const c=vidCb; vidCb=null; c&&c(); },550); };
  v.onended=fin; v.onerror=()=>{ VIDS_OK=false; fin(); };
  const pr=v.play(); if(pr&&pr.catch) pr.catch(()=>{ v.muted=true; v.play().catch(()=>fin()); });
  $('#vidSkip').onclick=fin;
}

function renderText(){
  const p=PAGES[S.page]; const txt=tpl(p[S.lang]);

  const box=$('#txt'); box.innerHTML=''; wordMap=[]; let pos=0;
  txt.split(/(\s+)/).forEach(tok=>{ if(/^\s+$/.test(tok)){ box.appendChild(document.createTextNode(tok)); pos+=tok.length; return; } if(!tok) return; const sp=document.createElement('span'); sp.className='w'; sp.textContent=tok; box.appendChild(sp); wordMap.push({s:pos,e:pos+tok.length,el:sp}); pos+=tok.length; });

function go(i){

  $('#roomPhoto')?.remove();

/* ---- Hologram: 4 views for a phone pyramid (Pepper's ghost) ---- */
let holoRun=false; const holoImg=new Image(); holoImg.src=IMG.bright;
function openHolo(){
  stopSpeak(); stopNarr(); $('#holo').classList.remove('hidden'); holoRun=true;
  const hv=document.createElement('video'); hv.src='vid/v10.mp4'; hv.loop=true; hv.muted=true; hv.playsInline=true; hv.play().catch(()=>{}); window.__hv=hv;
  const c=$('#holoCanvas'), x=c.getContext('2d'); const D=Math.min(2,devicePixelRatio||1);
  const sz=Math.min(innerWidth,innerHeight); c.width=sz*D; c.height=sz*D; c.style.width=sz+'px'; c.style.height=sz+'px';
  let t=0; const sp=[...Array(30)].map(()=>({a:Math.random()*6.28,r:Math.random(),s:Math.random()*2+1}));
  const draw=()=>{
    if(!holoRun) return; t+=.016;
    x.setTransform(1,0,0,1,0,0); x.fillStyle='#000'; x.fillRect(0,0,c.width,c.height);
    const cx=c.width/2, cy=c.height/2, s=c.width*.24;
    for(let k=0;k<4;k++){
      x.save(); x.translate(cx,cy); x.rotate(k*Math.PI/2);
      // each view sits on one side, head pointing outward (away from centre)
      const off=c.width*.31 + Math.sin(t*1.6)*c.width*.012;
      x.translate(0, off); x.rotate(Math.PI); // flip so the top of Nori points outward
      x.globalCompositeOperation='lighter';
      const wob=Math.sin(t*2)*.08; x.rotate(wob);
      if(hv.readyState>=2 && hv.videoWidth){ const vh=hv.videoHeight, sq=vh*.9; x.drawImage(hv,(hv.videoWidth-sq)/2,(vh-sq)/2,sq,sq,-s*.65,-s*.65,s*1.3,s*1.3); }
      else if(holoImg.complete) x.drawImage(holoImg,-s/2,-s/2,s,s);
      sp.forEach(p=>{ const rr=s*(.35+.25*p.r), aa=p.a+t*p.s*.3; x.fillStyle=`rgba(255,230,150,${.4+.4*Math.sin(t*3+p.a)})`; x.beginPath(); x.arc(Math.cos(aa)*rr,Math.sin(aa)*rr,p.s*D,0,7); x.fill(); });
      x.restore();
    }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw); SFX.magic();
}

    h+=`<div class="ptxt" dir="${u.dir}">${esc(tpl(p[S.lang]))}${S.bi&&S.bi!==S.lang?`<div class="ptxt2" dir="${UI[S.bi].dir}">${esc(tpl(p[S.bi],S.bi))}</div>`:''}${S.bi2?`<div class="ptxt2" dir="${UI[S.bi2].dir}">${esc(tpl(p[S.bi2],S.bi2))}</div>`:''}</div><span class="pbrand">✦ MED TITI</span><span class="pnum">${i+1}</span></section>`;
  });
  h+=`<section class="pp"><div class="pend"><div class="col"><h2>${esc(u.pT)}</h2><p>${esc(u.pSub)}</p><ol>${u.pQ.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div><div class="col"><img id="printCert" alt=""></div></div><span class="pbrand">✦ MED TITI</span></section>`;
  box.innerHTML=h;
  $('#printCert').src = makeCertDataURL('image/jpeg');
}
function printBook(){ stopSpeak(); stopNarr(); S.printOwner=true; buildPrint(); S.printOwner=false; setTimeout(()=>{ try{ window.print(); }catch(e){} },400); }

document.addEventListener('contextmenu',e=>{ if(!e.target.closest('#certImg')) e.preventDefault(); });
document.addEventListener('dragstart',e=>e.preventDefault());
(function boot(){
  const saved=store.get(); if(saved) Object.assign(S,saved);
  else { const nl=(navigator.language||'ar').slice(0,2); if(UI[nl]) S.lang=nl; }
  if(saved==null){ const weak=(navigator.hardwareConcurrency||4)<=2 || (navigator.deviceMemory&&navigator.deviceMemory<=2) || matchMedia('(prefers-reduced-motion: reduce)').matches; S.lite=!!weak; }
  $('#nameIn').value=S.name; applyLite(); paintSetup();
  // preload images
  Object.values(IMG).forEach(src=>{ const i=new Image(); i.src=src; });
})();
